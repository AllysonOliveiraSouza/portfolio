<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Allyson Souza - Desenvolvedor Fullstack</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Custom Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap icons-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column h-100 bg-light">
    <main class="flex-shrink-0">
      <!-- Navigation-->
      <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
        <div class="container px-5">
          <a class="navbar-brand" href="index.html"
            ><span class="fw-bolder text-dark">Allyson Souza</span></a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bolder">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Início</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="resume.html">Currículo</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="projects.html">Projetos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html">Contato</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <!-- Projects Section-->
      <section class="py-5">
        <div class="container px-5 mb-5">
          <div class="text-center mb-5">
            <h1 class="display-5 fw-bolder mb-0">
              <span class="text-gradient d-inline">Projetos</span>
            </h1>
          </div>
          <div class="row gx-5 justify-content-center">
            <div
              class="col-lg-11 col-xl-9 col-xxl-8"
              id="container-lista-projetos"
            ></div>
          </div>
        </div>
      </section>
      <!-- Call to action section-->
      <section class="py-5 bg-gradient-primary-to-secondary text-white">
        <div class="container px-5 my-5">
          <div class="text-center">
            <h2 class="display-4 fw-bolder mb-4">
              Caso queira entrar em contato comigo
            </h2>
            <a
              class="btn btn-outline-light btn-lg px-5 py-3 fs-6 fw-bolder"
              href="contact.html"
              >Clique aqui</a
            >
          </div>
        </div>
      </section>

      <!-- Detalhes projeto modal -->

      <div
        class="modal"
        id="detalhes-projeto"
        data-bs-backdrop="static"
        data-bs-keyboard="false"
        tabindex="-1"
        aria-labelledby="modal-titulo"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-xl modal-dialog-centered">
          <div class="modal-content p-3 rounded-4">
            <div
              class="w-100 d-flex align-items-center justify-content-between p-2"
            >
              <h1 class="modal-title fs-5" id="modal-titulo">
                Título do Projeto
              </h1>
              <button
                type="button"
                class="btn-close me-2"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>

            <div class="modal-main-detalhe-projeto">
              <div class="box-video-projeto bg-dark mb-2 rounded-4">
                <h3 class="text-center text-gradient" id="titulo-projeto-video">
                  Projeto X
                </h3>
                <iframe
                  class="flex-grow-1"
                  src=""
                  title=""
                  allowfullscreen
                  id="iframe-video-projeto"
                ></iframe>
              </div>

              <div class="box-detalhes-projeto bg-dark rounded-4">
                <div
                  class="w-100 h-60 p-4 d-flex justify-content-center align-items-center"
                >
                  <p
                    id="descricao-projeto"
                    class="m-0 text-white text-center"
                  ></p>
                </div>
                <div class="w-100 h-40 container">
                  <div class="row h-100">
                    <div
                      class="col d-flex justify-content-center align-items-center gap-2 rounded-4"
                      id="box-github-projeto"
                    >
                      <div class="fs-2 d-flex justify-content-center">
                        <a
                          class="text-gradient"
                          id="link-github-projeto"
                          href="#!"
                          target="_blank"
                          ><i class="bi bi-github"></i
                        ></a>
                      </div>
                      <span class="fw-bold fs-6 mt-1 text-gradient"
                        >Código do projeto</span
                      >
                    </div>

                    <div
                      class="col d-flex justify-content-center align-items-center gap-2 rounded-4"
                      id="box-tecnologias-projeto"
                    >
                      <div class="fs-2 d-flex justify-content-center">
                        <a class="text-gradient" href="#!"
                          ><i class="bi bi-code-slash"></i
                        ></a>
                      </div>
                      <span class="fw-bold fs-6 mt-1 text-gradient"
                        >Tecnologias Utilizadas</span
                      >
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- Footer-->
    <footer class="bg-white py-4 mt-auto">
      <div class="container px-5">
        <div
          class="row align-items-center justify-content-center flex-column flex-sm-row"
        >
          <div class="col-auto">
            <div class="small m-0">Desenvolvido por Allyson Souza - 2025</div>
          </div>
        </div>
      </div>
    </footer>
    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
    <script src="js/projetos.js"></script>
  </body>
</html>
